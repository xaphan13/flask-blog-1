server {
    listen 443 ssl;

    server_name xaphan.ru, www.xaphan.ru;

    ssl_certificate /home/cert/certificate.pem;
    ssl_certificate_key /home/cert/private_key.pem;

    root /home/web/default;

    client_max_body_size 1000M;

    location /pgadmin {
        proxy_pass http://172.20.1.3:5123;
        proxy_set_header Host $host;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_redirect off;
        proxy_intercept_errors on;
    }

    location / {
        proxy_pass http://172.20.1.50:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

}
